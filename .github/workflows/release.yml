name: Release

# Tags v* build everything and publish a draft GitHub release.
# Pull requests that touch the release machinery run the same builds as a
# dry run (nothing is published), so a broken release never reaches a tag.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release.sh
      - desktop/src-tauri/**
  workflow_dispatch:

permissions:
  contents: read

env:
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  web:
    name: Web edition (all platforms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - run: make web
      - run: scripts/release.sh web-all
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: release/*
          if-no-files-found: error

  desktop:
    name: Desktop ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - name: Linux arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - name: macOS universal
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - name: Windows arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            librsvg2-dev libayatana-appindicator3-dev patchelf file
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets || matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - name: Build the backend sidecar
        run: scripts/release.sh sidecar ${{ matrix.target }}
      - name: Build the app
        working-directory: desktop
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Collect bundles and portable archives
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/release.sh collect "$TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: scripts/release.sh checksums
      - name: Release notes from the changelog
        run: scripts/release.sh notes "${GITHUB_REF_NAME#v}" > notes.md
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --draft --title "Untis $GITHUB_REF_NAME" --notes-file notes.md
